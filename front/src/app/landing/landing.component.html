<!DOCTYPE html>
<html lang="en">
  <div id="video-container">
    <video
      #videoElement
      id="video-background"
      muted
      autoplay
      loop
      [src]="currentVideoSource"
    >
      Your browser does not support the video tag.
    </video>
  </div>

  <body>
    <section class="hero">
      <div>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Landing Page</title>
        <link rel="stylesheet" />
      </div>
      <div class="hero-content">
        <h1 class="hero-title">Welcome to the Aurora Project</h1>
        <a href="#" class="cta-button" routerLink="/login">Get Started</a>
      </div>
    </section>
  </body>

  <footer>
    <p>
      &copy; 2023 Project Aurora. All rights reserved |
      {{ appEnvironment }} {{ appVersion }}
    </p>
  </footer>
</html>
