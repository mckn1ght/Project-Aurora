<div class="homepage">
  <div class="background"></div>
  <header class="top-menu">
    <div class="logo">
      <img
        class="logoImage"
        src="../../assets/icons/fossil.shell@2x.png"
        alt="Logo"
        style="display: inline-block"
      />
      <h1 style="display: inline-block">Project Aurora</h1>
    </div>
    <nav>
      <ul>
        <li><a href="/home">Home</a></li>
        <li><a href="/landing">Landing</a></li>
        <li><a href="/login">Logout</a></li>
        <button class="add-request-button" (click)="navigateToNewJob()">
          Publica un anunt
        </button>
      </ul>
    </nav>
  </header>

  <div class="container">
    <header>
      <h1>Bine ai venit la Servicii Rapide!</h1>
      <p>Solutii rapide pentru problemele tale de renovare si instalatii.</p>
    </header>
    <div class="search-bar">
      <input
        class="search-input"
        type="text"
        id="searchInput"
        [(ngModel)]="searchInput"
        placeholder="Joburi, domenii, locatii..."
      />
      <button class="search-button" (click)="navigateToJobSearch()">
        Cauta
      </button>
    </div>
    <section class="services">
      <section class="services">
        <div class="service" *ngFor="let expertiseArea of expertiseAreasList">
          <button [routerLink]="'/servicii/' + expertiseArea.name">
            <div class="domain-icon">
              <!-- Add an icon for each domain (you may need to replace the [icon] attribute) -->
              <img
                [src]="'/assets/icons/' + expertiseArea.iconName + '.png'"
                alt="{{ expertiseArea.name }} Icon"
              />
            </div>
            <h2>{{ expertiseArea.name }}</h2>
            <p>{{ expertiseArea.description }}</p>
          </button>
        </div>
      </section>
    </section>
  </div>

  <footer>
    <p>
      &copy; 2023 Project Aurora. All rights reserved | {{ appEnvironment }}
      {{ appVersion }}
    </p>
  </footer>
</div>
