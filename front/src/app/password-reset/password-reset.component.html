<!-- password-reset.component.html -->

<div class="password-reset-container">
  <div class="password-reset-form">
    <h2>Formular resetare parola</h2>
    <p>Introduceti noua parola:</p>

    <div class="form-group">
      <label for="newPassword">Noua Parola</label>
      <input
        type="password"
        id="newPassword"
        [(ngModel)]="newPassword"
        required
      />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmare Parola</label>
      <input
        type="password"
        id="confirmPassword"
        [(ngModel)]="confirmPassword"
        required
      />
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div class="button-container">
      <button (click)="resetPassword()">Resetare</button>
      <button (click)="cancel()">Anuleaza</button>
    </div>
  </div>
</div>
<footer>
  <p>
    &copy; 2023 Project Aurora. All rights reserved | {{ appEnvironment }}
    {{ appVersion }}
  </p>
</footer>
