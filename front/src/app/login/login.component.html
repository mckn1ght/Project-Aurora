<div id="login-container">
  <div class="background"></div>
  <div class="login-container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          name="username"
          minlength="5"
          [(ngModel)]="formData.username"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="formData.password"
          required
          minlength="5"
        />
      </div>
      <div *ngIf="error" class="errorLabel">{{ error }}</div>
      <div></div>
      <!-- <button class="button" type="submit">Login</button> -->
      <button p-Button type="submit" class="button">Login</button>
      <div>
        <a class="register" href="/register"> Creare cont nou! </a>
      </div>
    </form>
  </div>
</div>
<footer>
  <p>
    &copy; 2023 Project Aurora. All rights reserved | {{ appEnvironment }}
    {{ appVersion }}
  </p>
</footer>
