<header class="top-menu">
  <div class="logo">
    <img
      class="logoImage"
      src="../../assets/icons/fossil.shell@2x.png"
      alt="Logo"
      style="display: inline-block"
    />
    <h1 style="display: inline-block">Project Aurora</h1>
  </div>
  <nav>
    <ul>
      <li><a href="/home">Home</a></li>
      <li><a href="/landing">Landing</a></li>
      <li><a href="/profile">Profil</a></li>
      <li><a href="/login">Logout</a></li>
      <li><a href="/my-jobs">My Jobs</a></li>
    </ul>
  </nav>
</header>

<div class="container mt-4">
  <p-accordion>
    <p-accordionTab
      header="{{ table | uppercase }}"
      *ngFor="
        let table of [
          'bid',
          'expertiseArea',
          'job',
          'jobExpertiseArea',
          'review',
          'specialist',
          'specialistExpertiseArea',
          'user',
          'resource'
        ]
      "
    >
      <p-table
        [value]="data[table]"
        [responsive]="true"
        styleClass="p-datatable-responsive"
      >
        <ng-template pTemplate="header">
          <tr>
            <th
              *ngFor="
                let headerKey of data[table][0] ? getKeys(data[table][0]) : []
              "
            >
              {{ headerKey }}
            </th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
          <tr>
            <td *ngFor="let bodyKey of getKeys(item)">
              <!-- Editable fields for job -->
              <ng-container
                *ngIf="
                  table === 'job' &&
                  [
                    'title',
                    'description',
                    'location',
                    'assignedToSpecialist',
                    'currentWorkflowStep'
                  ].includes(bodyKey)
                "
              >
                <ng-container *ngIf="!isEditing('job', item.id)">
                  {{ item[bodyKey] }}
                  <button
                    pButton
                    type="button"
                    icon="pi pi-pencil"
                    class="p-button-rounded p-button-success"
                    (click)="enableEdit('job', item.id)"
                  ></button>
                </ng-container>
                <ng-container *ngIf="isEditing('job', item.id)">
                  <input
                    [(ngModel)]="item[bodyKey]"
                    class="p-inputtext p-component"
                    style="width: 100%"
                    [type]="bodyKey === 'email' ? 'email' : 'text'"
                  />
                </ng-container>
              </ng-container>

              <!-- Editable fields for user -->
              <ng-container
                *ngIf="
                  table === 'user' &&
                  ['username', 'email', 'phoneNumber', 'credit'].includes(
                    bodyKey
                  )
                "
              >
                <ng-container *ngIf="!isEditing('user', item.id)">
                  {{ item[bodyKey] }}
                  <button
                    pButton
                    type="button"
                    icon="pi pi-pencil"
                    class="p-button-rounded p-button-success"
                    (click)="enableEdit('user', item.id)"
                  ></button>
                </ng-container>
                <ng-container *ngIf="isEditing('user', item.id)">
                  <input
                    [(ngModel)]="item[bodyKey]"
                    class="p-inputtext p-component"
                    style="width: 100%"
                    [type]="bodyKey === 'email' ? 'email' : 'text'"
                  />
                </ng-container>
              </ng-container>

              <ng-container
                *ngIf="
                  !(
                    table === 'job' &&
                    [
                      'title',
                      'description',
                      'location',
                      'assignedToSpecialist',
                      'currentWorkflowStep'
                    ].includes(bodyKey)
                  ) &&
                  !(
                    table === 'user' &&
                    ['username', 'email', 'phoneNumber', 'credit'].includes(
                      bodyKey
                    )
                  )
                "
              >
                {{ item[bodyKey] }}
              </ng-container>
            </td>
            <td>
              <div class="button-container">
                <button
                  *ngIf="isEditing(table, item.id)"
                  pButton
                  type="button"
                  icon="pi pi-check"
                  class="p-button-rounded p-button-success"
                  (click)="
                    table === 'job'
                      ? saveJob(item)
                      : table === 'user'
                      ? saveUser(item)
                      : ''
                  "
                ></button>
                <p-button
                  *ngIf="isEditing(table, item.id)"
                  icon="pi pi-times"
                  [rounded]="true"
                  severity="danger"
                  [outlined]="true"
                  (click)="disableEdit(table, item.id)"
                ></p-button>
                <button
                  pButton
                  type="button"
                  icon="pi pi-trash"
                  class="p-button-danger"
                  (click)="deleteEntry(table, item.id)"
                ></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-accordionTab>
  </p-accordion>
</div>

<p-confirmDialog></p-confirmDialog>

<footer>
  <p>
    &copy; 2023 Project Aurora. All rights reserved | {{ appEnvironment }}
    {{ appVersion }}
  </p>
</footer>
