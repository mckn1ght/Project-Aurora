<!-- In src/app/admin-panel/admin-panel.component.html -->

<header class="top-menu">
  <div class="logo">
    <img
      class="logoImage"
      src="../../assets/icons/fossil.shell@2x.png"
      alt="Logo"
      style="display: inline-block"
    />
    <h1 style="display: inline-block">Project Aurora</h1>
  </div>
  <nav>
    <ul>
      <li><a href="/home">Home</a></li>
      <li><a href="/landing">Landing</a></li>
      <li><a href="/profile">Profil</a></li>
      <li><a href="/login">Logout</a></li>
      <li><a href="/my-jobs">My Jobs</a></li>
    </ul>
  </nav>
</header>

<div class="container mt-4">
  <p-accordion>
    <p-accordionTab
      header="{{ table | uppercase }}"
      *ngFor="
        let table of [
          'bid',
          'expertiseArea',
          'job',
          'jobExpertiseArea',
          'review',
          'specialist',
          'specialistExpertiseArea',
          'user'
        ]
      "
    >
      <p-table
        [value]="data[table]"
        [responsive]="true"
        styleClass="p-datatable-responsive"
      >
        <ng-template pTemplate="header">
          <tr>
            <th
              *ngFor="let key of data[table][0] ? getKeys(data[table][0]) : []"
            >
              {{ key }}
            </th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
          <tr>
            <td *ngFor="let key of getKeys(item)">
              <div class="text-wrap" title="{{ item[key] }}">
                {{ item[key] }}
              </div>
            </td>
            <td>
              <button
                pButton
                type="button"
                icon="pi pi-trash"
                class="p-button-danger"
                (click)="deleteEntry(table, item.id)"
              ></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-accordionTab>
  </p-accordion>
</div>
<p-confirmDialog></p-confirmDialog>

<footer>
  <p>
    &copy; 2023 Project Aurora. All rights reserved | {{ appEnvironment }}
    {{ appVersion }}
  </p>
</footer>
